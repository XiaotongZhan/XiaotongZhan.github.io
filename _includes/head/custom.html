<!-- Fira Code monospace（去重，保留一份） -->
<link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet" />

<!-- 代码样式与复制按钮的基础样式（深浅色自适应） -->
<style>

  /* Code font */
  code, pre, .highlight code, .highlight pre {
    font-family: "Fira Code", "SFMono-Regular", Consolas, Menlo, monospace !important;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre;
    word-break: normal;
    margin: 0;
  }

  /* Inline code */
  p code {
    padding: 2px 6px;
    font-size: 13px;
    background-color: #eee;
    border-radius: 4px;
  }

  /* Code wrapper (light) */
  .code-wrapper {
    position: relative;
    overflow-x: auto;
    padding: 12px;
    border-radius: 6px;
    background-color: #f7f7f7;
  }

  /* Dark mode adaptation */
  @media (prefers-color-scheme: dark) {
    p code { background-color: #2a2a2a; }
    .code-wrapper { background-color: #1e1e1e; }
  }

  /* Copy button (样式保留，可选) */
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background-color: transparent;
    color: #2e2d2d;
    border: 1px solid #2e2d2d;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.2s ease-in-out;
    z-index: 10;
  }

  .copy-btn:hover { opacity: 1; }

  /* 隐藏代码语言/装饰徽标，避免与 Copy 重叠 */
  [class*="language-"].highlighter-rouge::before,
  [class*="language-"].highlighter-rouge::after,
  .highlighter-rouge > .highlight::before,
  .highlighter-rouge > .highlight::after {
    content: none !important;
    display: none !important;
  }
</style>

<!-- Clipboard.js for copy buttons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.6/clipboard.min.js" defer></script>

<!-- end custom head snippets -->
